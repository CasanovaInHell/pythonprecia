<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pythonprecia">
<title>Pythonprecia — free Python on iPhone</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #0d1117; color: #e6edf3; display: flex; flex-direction: column; height: 100dvh; }
  header { padding: 12px 16px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 10px; }
  header .logo { font-size: 22px; }
  header h1 { font-size: 18px; margin: 0; font-weight: 700; }
  header p { margin: 0; font-size: 12px; color: #8b949e; }
  #status { margin-left: auto; font-size: 12px; color: #d29922; text-align: right; }
  #status.ready { color: #3fb950; }
  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  textarea { flex: 1; width: 100%; border: 0; resize: none; padding: 14px 16px; background: #0d1117; color: #e6edf3; font-family: ui-monospace, Menlo, monospace; font-size: 15px; line-height: 1.5; outline: none; -webkit-appearance: none; }
  .bar { display: flex; gap: 10px; padding: 10px 12px; background: #161b22; border-top: 1px solid #30363d; border-bottom: 1px solid #30363d; }
  button { flex: 1; padding: 13px 0; font-size: 16px; font-weight: 600; border-radius: 10px; border: 1px solid #30363d; background: #21262d; color: #e6edf3; }
  button#run { background: #238636; border-color: #238636; color: #fff; }
  button:disabled { opacity: .5; }
  #outwrap { height: 38%; display: flex; flex-direction: column; min-height: 0; }
  #outlabel { padding: 8px 16px 0; font-size: 12px; color: #8b949e; text-transform: uppercase; letter-spacing: .08em; }
  pre { flex: 1; margin: 0; padding: 10px 16px 16px; overflow: auto; font-family: ui-monospace, Menlo, monospace; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .err { color: #f85149; }
  footer { padding: 8px 16px calc(8px + env(safe-area-inset-bottom)); font-size: 11px; color: #8b949e; background: #161b22; border-top: 1px solid #30363d; }
</style>
</head>
<body>
<header>
  <div class="logo">🐍</div>
  <div>
    <h1>Pythonprecia</h1>
    <p>Free Python, right on your iPhone. No store, no cost.</p>
  </div>
  <div id="status">warming up…</div>
</header>
<main>
  <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off">print("Ahoy from Pythonprecia!")

# Write any Python you like, then tap Run.
for n in range(1, 6):
    print("n squared is", n * n)

name = "sailor"
print(f"Fair winds, {name}.")
</textarea>
  <div class="bar">
    <button id="run" disabled>▶ Run</button>
    <button id="clear">Clear output</button>
  </div>
  <div id="outwrap">
    <div id="outlabel">Output</div>
    <pre id="out"></pre>
  </div>
</main>
<footer>Tip: tap the Share button in Safari, then "Add to Home Screen" — Pythonprecia becomes an app icon. Made for Noah, for the love of god.</footer>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
  const statusEl = document.getElementById('status');
  const outEl = document.getElementById('out');
  const runBtn = document.getElementById('run');
  const codeEl = document.getElementById('code');
  let pyodide = null;

  function printOut(text) {
    outEl.textContent += text + "\n";
    outEl.scrollTop = outEl.scrollHeight;
  }
  function printErr(text) {
    const span = document.createElement('span');
    span.className = 'err';
    span.textContent = text + "\n";
    outEl.appendChild(span);
    outEl.scrollTop = outEl.scrollHeight;
  }

  (async () => {
    try {
      pyodide = await loadPyodide();
      pyodide.setStdout({ batched: (s) => printOut(s) });
      pyodide.setStderr({ batched: (s) => printErr(s) });
      statusEl.textContent = "ready ⚓";
      statusEl.classList.add('ready');
      runBtn.disabled = false;
    } catch (e) {
      statusEl.textContent = "failed to load";
      printErr("Python could not load. Check your connection and reload the page.");
    }
  })();

  runBtn.addEventListener('click', async () => {
    if (!pyodide) return;
    runBtn.disabled = true;
    try {
      await pyodide.runPythonAsync(codeEl.value);
    } catch (e) {
      printErr(String(e.message || e));
    }
    runBtn.disabled = false;
  });

  document.getElementById('clear').addEventListener('click', () => { outEl.textContent = ""; });
</script>
</body>
</html>
